[project]
name = "mani_skill"
description = "ManiSkill4: A Unified Benchmark for Generalizable Manipulation Skills"
authors = [
    { name = "ManiSkill contributors", email = "stonezt2019@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "dacite>=1.9.2",
    "defusedxml>=0.7.1",
    "gitpython>=3.1.50",
    "h5py>=3.16.0",
    "imageio[ffmpeg]>=2.37.3",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "rich>=15.0.0",
    "tqdm>=4.68.2",
    "transforms3d>=0.4.2",
    "trimesh>=4.12.2",
    "tyro>=1.0.13",
    "warp-lang>=1.15.0",
]

[project.optional-dependencies]
sapien = [
    "sapien>=3.0.3",
]
newton = [
    "imgui-bundle>=1.92.801",
    "mujoco==3.10",
    "mujoco-warp==3.10.0.2",
    "newton>=1.4.0",
    "pyglet>2",
]
mujoco = [
    "mujoco",
    "mujoco-warp",
]
gymnasium = [
    "gymnasium>=1.3.0",
]

dev = [
    "nvidia-ml-py>=13.610.43",
    "pre-commit",
    "pytest",
    "ruff",
    "ty",
    "pyright",
    "ipython",
    "ipdb",
    "pybind11-stubgen",
]


[dependency-groups]
docs = [
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.18.0",
    "sphinx>=9.0.4",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-copybutton>=0.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "mani_skill/__init__.py"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "serial",
    "gpu_sim: marks tests as using the GPU simulation (deselect with '-m \"not gpu_sim\"')",
    "serial",
]

###################################################################################################
# FORMATTING AND LINTING SETUP
# #################################################################################################

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # PEP8
    "W",
    # flake8-annotations
    "ANN",
]
ignore = [
    "C408", # don't complain about usage of dict() calls
    "C901", # don't complain about function complexity
    "E501", # don't complain about line-length (handled by line-length setting)
    "B006", # defaults shouldn't be mutable
    "UP015", # redundant mode arguments in open should be fine for now
    "SIM117", # allow nested with statements for now
    "SIM102", # don't be picky about nested if statements
    "SIM114", # don't be picky about merging if branches using or
    "B905", # allow zip() without `strict` parameter
    "B026", # allow star-arg after keyword argument for now
    "ANN001", #	missing-type-function-argument
    "ANN201", # missing-return-type-undocumented-public-function
    "ANN202", # missing-return-type-private-function
    "ANN003", # missing-type-kwargs
    "E402", # module-import-not-at-top-of-file
    "ANN401", # allow dynamic typed expressions
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
exclude = [
    "**/__pycache__",
    "mani_skill/assets",
]
include = ["mani_skill"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"

[[tool.pyright.executionEnvironments]]
root = "."
